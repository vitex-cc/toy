# nginx site for the toy app. Installed as /etc/nginx/conf.d/toy.vitex.cc.conf
# (both the Ubuntu and nginx.org packages include conf.d/*.conf). Files are published to the
# root below by `npm run deploy`.
server {
    listen 80;
    listen [::]:80;
    server_name toy.vitex.cc;

    root /opt/service/toy;
    index index.html;

    access_log /var/log/nginx/toy.access.log;
    error_log  /var/log/nginx/toy.error.log;

    # The JS bundle embeds base64 audio/images; gzip cuts the transfer a lot.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # Build assets have content hashes in their names, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must be revalidated so a new deploy shows up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
